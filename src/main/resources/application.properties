spring.application.name=ai-coding-capstone
spring.datasource.url=jdbc:h2:mem:capstone;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

capstone.security.username=${CAPSTONE_USERNAME}
capstone.security.password=${CAPSTONE_PASSWORD}

server.error.include-message=never
server.error.include-stacktrace=never
